<title>Siege Engines</title>
<style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--anatomy-page);color:var(--anatomy-text);font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body[data-theme="light"]{color-scheme:light}
body[data-theme="dark"]{color-scheme:dark}
.iso{--hair:color-mix(in srgb,var(--anatomy-mid) 55%,transparent);--hair2:color-mix(in srgb,var(--anatomy-mid) 28%,transparent);--accent:#d9480f;--accent-soft:color-mix(in srgb,#d9480f 14%,transparent);--hole:#5d5852;--crater:color-mix(in srgb,#6b5f50 30%,transparent)}
.iso[data-theme="dark"]{--accent:#ff7a3d;--accent-soft:color-mix(in srgb,#ff7a3d 16%,transparent);--hole:#0a0a0a;--crater:color-mix(in srgb,#000 45%,transparent)}
button{font:inherit;color:inherit}
kbd{font-family:var(--anatomy-mono);font-size:9.5px;color:var(--anatomy-muted);border:1px solid var(--hair2);border-radius:3px;padding:0 4px;line-height:15px;margin-left:8px}

/* header */
.hd{display:flex;align-items:center;gap:22px;padding:12px 24px;border-bottom:1px solid var(--hair2);position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--anatomy-page) 92%,transparent);backdrop-filter:blur(8px)}
.hd-brand{display:flex;align-items:center;gap:10px;font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--anatomy-strong);white-space:nowrap}
.hd-brand svg{width:22px;height:15px;fill:none;stroke:var(--anatomy-strong);stroke-width:1.1;stroke-linejoin:round}
.hd-index{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.hd-index::-webkit-scrollbar{display:none}
.ix{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:5px 10px 6px;border:0;background:none;border-radius:6px;cursor:pointer;white-space:nowrap;color:var(--anatomy-muted);transition:background .25s,color .25s}
.ix b{font-family:var(--anatomy-mono);font-weight:500;font-size:9.5px;letter-spacing:.06em;color:var(--anatomy-muted)}
.ix span{font-size:12px;letter-spacing:.01em}
.ix:hover{background:var(--hair2);color:var(--anatomy-text)}
.ix[data-on="1"]{background:var(--anatomy-card);color:var(--anatomy-strong);box-shadow:0 0 0 1px var(--hair)}
.ix[data-on="1"] b{color:var(--accent)}
.hd-tools{display:flex;gap:6px}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:16px;padding:16px 24px 40px;max-width:1720px;margin:0 auto;align-items:start}
.pl-stage{grid-column:1;grid-row:1}
.pl-range{grid-column:1;grid-row:2}
.deck{grid-column:2;grid-row:1/span 2;position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;scrollbar-width:thin}
.plate{position:relative;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--hair);padding:42px 18px 40px;--anatomy-paper:var(--anatomy-card)}
.corners{position:absolute;inset:15px 18px;pointer-events:none;font-family:var(--anatomy-mono);font-size:10.5px;letter-spacing:.04em;color:var(--anatomy-muted);z-index:2}
.corners span{position:absolute;white-space:nowrap}
.c-fig{top:0;left:0;color:var(--anatomy-text)}
.c-title{top:0;right:0;text-transform:uppercase;letter-spacing:.12em}
.c-hint{bottom:0;left:0;text-transform:uppercase;letter-spacing:.12em}
.c-read{bottom:0;right:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}

/* stage */
.st-stage{position:relative;outline:none;touch-action:pan-y;cursor:grab;user-select:none}
.st-stage[data-zoomed="1"]{cursor:move}
.st-stage>svg,.st-stage>canvas{display:block;width:100%;height:auto}
.st-stage>svg:not(:first-child),.st-stage>canvas{position:absolute;inset:0;height:100%!important;pointer-events:none}
.st-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.st-zoom{position:absolute;right:16px;top:40px;display:flex;flex-direction:column;gap:4px;z-index:3}
.st-stage svg{overflow:hidden}
.st-stage[data-cut="1"] .pt[data-cut]{display:none}
.pt[data-on] .iso-solid>.iso-edge,.pt[data-on] .tb-edge{stroke:var(--accent)!important;stroke-width:1.1}
.pt[data-on] .iso-solid>.iso-top{fill:var(--anatomy-lit-top)}
.pt[data-on] .iso-solid>.iso-fill{fill:color-mix(in srgb,var(--accent) 7%,var(--anatomy-paper))}
.st-stage[data-focus]:not([data-focus=""]) .pt:not([data-on]) .iso-edge{stroke:var(--anatomy-mid)}
.cord,.rope-line{stroke-linecap:round;vector-effect:none!important}
[data-mat="rope"] .rope-line{stroke:var(--anatomy-mid)}
.st-stage .iso-halo{opacity:calc(var(--anatomy-halo-opacity) * .9)}

/* range */
.pl-range{padding:38px 18px 30px}
.rg-stage{position:relative}
.rg-view{position:relative}
.rg-view>svg,.rg-view>canvas{display:block;width:100%;height:auto}
.rg-view>svg:not(:first-child),.rg-view>canvas{position:absolute;inset:0;height:100%!important;pointer-events:none}
.rg-stage{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:center}
.rg-inset{position:relative;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--hair2);--anatomy-paper:var(--anatomy-card);overflow:hidden}
.rg-inset svg{overflow:hidden!important}
.rg-loupe{position:absolute;left:8px;top:7px;width:13px;height:13px;fill:none;stroke:var(--anatomy-muted);stroke-width:1.3;stroke-linecap:round}
@media (max-width:760px){.rg-stage{grid-template-columns:minmax(0,1fr)}}
.rg-scale{position:relative;height:14px;margin-top:4px;font-family:var(--anatomy-mono);font-size:9.5px;color:var(--anatomy-muted)}
.rg-scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rg-hole{fill:var(--hole);stroke:var(--anatomy-hi);stroke-width:.6;vector-effect:non-scaling-stroke;opacity:.82}
.rg-crater{fill:var(--crater)}
.rg-trail{stroke-width:.9px}
.rg-trail.rg-now{stroke:var(--accent);stroke-width:1.3px}

/* deck */
.deck{background:var(--anatomy-card);box-shadow:0 0 0 1px var(--hair);padding:4px 0}
.dk{padding:14px 18px 16px;border-top:1px solid var(--hair2)}
.dk:first-child{border-top:0}
.dk h3{margin:0 0 10px;font:500 9.5px/1 var(--anatomy-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--anatomy-muted)}
.dk-ammo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.am{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 7px;border:0;border-radius:8px;background:none;box-shadow:0 0 0 1px var(--hair2);cursor:pointer;transition:box-shadow .2s,background .2s}
.am:hover{box-shadow:0 0 0 1px var(--hair)}
.am[data-on="1"]{box-shadow:0 0 0 1.2px var(--accent);background:var(--accent-soft)}
.am-ico{display:block;width:64px;height:46px}
.am-ico svg{width:100%;height:100%}
.am-name{font-size:11.5px;color:var(--anatomy-strong);text-align:center;line-height:1.25}
.am-mass{font-family:var(--anatomy-mono);font-size:9.5px;color:var(--anatomy-muted)}
.am kbd{position:absolute;top:5px;right:5px;margin:0;border:0;padding:0;font-size:8.5px}
.ct{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 8px;margin:0 0 12px;cursor:pointer}
.ct:last-child{margin-bottom:2px}
.ct-name{font-size:12px;color:var(--anatomy-text)}
.ct-val{font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-strong);font-variant-numeric:tabular-nums}
.ct-val i,.dk-read i{font-style:normal;color:var(--anatomy-muted);margin-left:4px;font-size:10px}
.ct input{grid-column:1/-1;width:100%;margin:4px 0 0;appearance:none;-webkit-appearance:none;height:16px;background:transparent;cursor:pointer}
.ct input::-webkit-slider-runnable-track{height:1px;background:var(--anatomy-mid)}
.ct input::-moz-range-track{height:1px;background:var(--anatomy-mid)}
.ct input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--anatomy-card);border:1.2px solid var(--anatomy-strong);box-shadow:0 1px 2px #0002}
.ct input::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--anatomy-card);border:1.2px solid var(--anatomy-strong)}
.ct input:focus-visible::-webkit-slider-thumb{border-color:var(--accent)}
.ct-rule{grid-column:1/-1;position:relative;height:5px;margin:-3px 6px 0}
.ct-rule b{position:absolute;top:0;width:0;height:3px;border-left:1px solid var(--anatomy-lo)}
.ct-rule b.mj{height:5px;border-color:var(--anatomy-mid)}
.dk-acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:0;border-radius:15px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--hair);font-family:var(--anatomy-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-strong);cursor:pointer;transition:box-shadow .2s,background .2s}
.btn:hover{box-shadow:0 0 0 1px var(--anatomy-strong)}
.btn .dot,.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--anatomy-lo);flex:none}
.btn.primary .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn[data-state="busy"] .dot{animation:sg-pulse .8s infinite}
.btn.ghost{color:var(--anatomy-muted)}
.btn kbd{margin-left:2px}

.dk-phase{display:flex;gap:3px;margin:12px 0 0;padding:0;list-style:none}
.dk-phase li{flex:1;min-width:0;padding-top:6px;border-top:2px solid var(--hair2);font-family:var(--anatomy-mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--anatomy-lo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s,border-color .2s}
.dk-phase li[data-past="1"]{border-color:var(--anatomy-mid);color:var(--anatomy-muted)}
.dk-phase li[data-on="1"]{border-color:var(--accent);color:var(--anatomy-strong)}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:24px;min-width:24px;padding:0 9px;border:0;border-radius:12px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--hair2);font-family:var(--anatomy-mono);font-size:10px;letter-spacing:.06em;color:var(--anatomy-text);cursor:pointer;transition:box-shadow .2s,background .2s}
.chip:hover{box-shadow:0 0 0 1px var(--hair)}
.chip.sq{padding:0;width:24px}
.chip[data-on="1"]{box-shadow:0 0 0 1.1px var(--accent);color:var(--anatomy-strong);background:var(--accent-soft)}
.chip[data-on="1"] .dot{background:var(--accent)}
.tl{display:flex;align-items:center;gap:10px}
.tl-track{position:relative;flex:1;height:26px;cursor:ew-resize;touch-action:none}
.tl-track::before{content:"";position:absolute;left:0;right:0;top:13px;border-top:1px solid var(--anatomy-mid)}
.tl-fill{position:absolute;left:0;top:12px;height:3px;background:var(--accent);width:0;border-radius:2px}
.tl-head{position:absolute;top:7px;width:1.5px;height:13px;background:var(--anatomy-strong);transform:translateX(-50%)}
.tl-marks i{position:absolute;top:16px;height:5px;border-left:1px solid var(--anatomy-mid)}
.tl-marks em{position:absolute;top:5px;left:2px;font:normal 8px/1 var(--anatomy-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--anatomy-muted);white-space:nowrap}
.tl-time{font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-strong);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.dk-speed{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.dk-focus,.dk-toggles{display:flex;flex-wrap:wrap;gap:5px}
.dk-toggles{margin-top:8px}
.dk-cam{margin-top:14px}
.dk-read{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0}
.dk-read dt{color:var(--anatomy-muted);font-size:11.5px}
.dk-read dd{margin:0;font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-strong);text-align:right;font-variant-numeric:tabular-nums}

@media (max-width:1180px){
  .grid{grid-template-columns:minmax(0,1fr);padding:12px}
  .pl-stage{grid-row:1}.deck{grid-column:1;grid-row:2;position:static;max-height:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .pl-range{grid-row:3}
  .deck>.dk:nth-child(3){order:-1}
  .dk{border-top:1px solid var(--hair2)}
}
@media (max-width:620px){
  .hd{gap:10px;padding:8px 12px}
  .hd-brand span{display:none}
  .plate{padding:36px 8px 34px}
  .corners{inset:12px 12px}
  .c-hint{display:none}
  .st-zoom{top:34px;right:8px}
}
@media (prefers-reduced-motion:reduce){.btn[data-state="busy"] .dot{animation:none}}

/* gallery */
.gallery{max-width:1720px;margin:0 auto;padding:18px 24px 48px}
.gl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gl-card{position:relative;display:block;padding:34px 12px 12px;border:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--hair2);cursor:pointer;text-align:left;transition:box-shadow .25s,transform .35s var(--anatomy-ease);--anatomy-paper:var(--anatomy-card)}
.gl-card:hover{box-shadow:0 0 0 1px var(--anatomy-strong);transform:translateY(-2px)}
.gl-fig{position:absolute;left:14px;top:12px;font-family:var(--anatomy-mono);font-size:10px;color:var(--anatomy-text)}
.gl-name{position:absolute;right:14px;top:12px;font-family:var(--anatomy-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--anatomy-muted)}
.gl-art{display:block;aspect-ratio:360/230}
.gl-art svg{width:100%;height:100%}
.gl-card:hover .gl-name{color:var(--accent)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.full .hd,body.full .pl-range{display:none}
body.full .grid{grid-template-columns:minmax(0,1fr) 340px;padding:10px;max-width:none}
body.full .pl-stage{grid-row:1/span 2}
body.full .deck{top:10px;max-height:calc(100vh - 20px)}
.pt.sel .iso-edge,.pt.sel .tb-edge{stroke:var(--accent)!important;stroke-width:1.1}
.pt[data-on] .cord,.pt[data-on] .rope-line,.pt[data-on]>.iso-line{stroke:var(--accent)!important}

      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    return iso(pointOf(F, s, radius ? radius(s) : splines && splines[i] ? splines[i].radius(s) : r0 + (r1 - r0) * u, angle), P);
  };
  const buckets = [[], [], [], [], []];
  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {

      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));

    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));

    let sweep = wrap(to - from);

    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);

    tones.push(toneRow);

  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;

      const b = run.map((j) => rings[i + 1][j]).reverse();

      all.push(d);

    const dr = meridian[i + 1][1] - meridian[i][1];

    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;

    const hi = Math.min(...ranges.map(([, x]) => x));

    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));

    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));

  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;

  let bevelPath = "";

    const ends = [];

    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);

      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }

  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;

    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {

    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];

      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));
  }
  return out;
}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));
  return total;
}

function cut(points, from, to) {
  const out = [];
  let walked = 0;
  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];
    const b = points[index];
    const length = len3(sub3(b, a));
    const start = walked;
    const end = walked + length;
    if (end >= from && start <= to) {
      const t0 = Math.max(0, (from - start) / (length || 1));
      const t1 = Math.min(1, (to - start) / (length || 1));
      if (!out.length) out.push(lerp3(a, b, t0));
      out.push(lerp3(a, b, t1));
    }
    walked = end;
  }
  return out;
}

const pointAlong = (points, at) => {
  const piece = cut(points, at, at + 0.01);
  return piece[0] ?? points[points.length - 1];
};

function tangentAlong(points, at) {
  const total = pathLength(points);
  const a = pointAlong(points, Math.max(0, at - 0.6));
  const b = pointAlong(points, Math.min(total, at + 0.6));
  return unit3(sub3(b, a));
}

function spiral(F, s, r0, r1, a0, a1, steps = 28) {
  const out = [];
  for (let index = 0; index <= steps; index++) {
    const t = index / steps;
    out.push(pointOf(F, s, r0 + (r1 - r0) * t, a0 + (a1 - a0) * t));
  }
  return out;
}

function arcPoints(F, s, r, a0, a1, steps = 24) {

      const left = idx.map((j) => off(j, 1)), right = idx.map((j) => off(j, -1));
      const capOf = (j, out) => {
        const [nx, ny, tx, ty] = nrm[j];
        const c = flat[j];
        const arc = [];
        for (let a = 1; a < 8; a++) {
          const t = (a / 8) * Math.PI;
          const cx = Math.cos(t), sx = Math.sin(t);
          arc.push([c[0] + nx * w * cx + out * tx * w * 0.45 * sx, c[1] + ny * w * cx + out * ty * w * 0.45 * sx]);
        }
        return arc;
      };
      const startCap = idx[0] === 0 && o.caps !== false ? capOf(0, -1).reverse() : [];
      const endCap = idx[idx.length - 1] === dense.length - 1 && o.caps !== false ? capOf(dense.length - 1, 1) : [];
      const body = poly([...left, ...endCap, ...right.slice().reverse(), ...startCap], true);
      let extra = "";
      if (w > 1.3) {
        const band = (f0, f1) => poly([...idx.map((j) => off(j, f0)), ...idx.slice().reverse().map((j) => off(j, f1))], true);
        extra += `<path class="tb-shine" d="${band(sgn * 0.12, sgn * 0.5)}"/><path class="tb-shade" d="${band(-sgn * 0.45, -sgn * 0.88)}"/>`;
      }
      if (twist) {
        const marks = [];
        const s0 = along[idx[0]], s1 = along[idx[idx.length - 1]];
        for (let s = Math.ceil(s0 / pitch) * pitch; s < s1; s += pitch) {
          let j = idx[0];
          while (j < idx[idx.length - 1] && along[j + 1] < s) j++;
          const u = (s - along[j]) / ((along[j + 1] ?? along[j]) - along[j] || 1);
          const p = [flat[j][0] + ((flat[j + 1] ?? flat[j])[0] - flat[j][0]) * u, flat[j][1] + ((flat[j + 1] ?? flat[j])[1] - flat[j][1]) * u];
          const [nx, ny, tx, ty] = nrm[j];
          marks.push([[p[0] + nx * w * 0.85 - tx * w * 0.5, p[1] + ny * w * 0.85 - ty * w * 0.5], [p[0] - nx * w * 0.85 + tx * w * 0.5, p[1] - ny * w * 0.85 + ty * w * 0.5]]);
        }
        if (marks.length) extra += `<path class="tb-ring" d="${marks.map((m) => poly(m)).join("")}" opacity="0.6"/>`;
      }
      const edges = poly([...startCap.slice().reverse(), ...left]) + poly(right) + (endCap.length ? poly([left[left.length - 1], ...endCap, right[right.length - 1]]) : "");
      const pid = `${id}~${pi}`;
      ids.push(pid);
      const p3 = idx.map((j) => dense[j]);
      partOf(pid, `<g class="tb"><path class="tb-body" d="${body}"/>${extra}<path class="iso-line tb-edge" data-tone="${o.tone || "hi"}" d="${edges}"/></g>`, shapeOf(p3, { r, edges: [unit(sub(p3[p3.length - 1], p3[0]))] }), { mat: "rope", ...o });
      j0 = j1;
    }
    return ids;
  }

  const B = {
    P,
    V,
    KS,
    unit: metresPerUnit,
    m: (metres) => metres / metresPerUnit,
    at,
    S,
    L,
    D,
    k,
    G,
    get dynamic() {
      return dynamic;
    },
    set dynamic(value) {
      dynamic = value;
    },
    visibleFace,
    // Re-emit the parts a block drew last time while its inputs are unchanged.
    keep(key, deps, fn) {
      if (!dynamic) return fn();
      const sig = JSON.stringify(deps);
      const hit = cache.get(key);
      if (hit && hit.sig === sig) {
        for (const p of hit.parts) scene.put(p);
        return;
      }
      const outer = capture;
      const list = [];
      capture = list;
      try {
        fn();
      } finally {
        capture = outer;
        if (outer) outer.push(...list);
      }
      cache.set(key, { sig, parts: list });
    },
    forget() {
      cache.clear();
    },
    raw(id, svg, shape, o = {}) {
      partOf(id, svg, shape || shapeOf([o.at || [0, 0, 0]], { r: o.r || 1 }), o);
    },
    solid(id, paths, shape, o = {}) {
      partOf(id, S(paths, o), shape, o);
    },

    // A squared timber (or iron bar) from a to b. w across (u), h up (v).
    beam(id, a, b, o = {}) {
      const { w = 4, h = w, up = [0, 0, 1], round = 0, bands = [], grain = 0, nails = [], pegs = [], s0 = 0, s1 = null, poly = null } = o;
      const F = frameFrom(a, b, up);
      const L0 = len(sub(b, a));
      const end = s1 ?? L0;
      const section = poly || (round > 0 ? polyRound(w, h, round) : polyRect(w, h));
      const cuts = [s0];
      const sorted = [...bands].map((band) => ({ at: band.at ?? band.s ?? band, w: band.w ?? Math.max(1.2, w * 0.35), t: band.t ?? Math.max(0.35, w * 0.08) })).sort((p, q) => p.at - q.at);
      for (const band of sorted) cuts.push(band.at - band.w / 2, band.at + band.w / 2);
      cuts.push(end);
      const segments = [];
      for (let i = 0; i < cuts.length; i += 2) segments.push([cuts[i], cuts[i + 1]]);
      segments.forEach(([from, to], index) => {
        if (to - from < 0.05) return;
        const paths = extrudeAlong(F, section, from, to, P);
        let inner = "";
        if (grain) {
          const lines = [];
          for (const f of faces(F, w, h)) {
            if (!visibleFace(f.n)) continue;
            for (let g = 1; g <= grain; g++) {
              const x = -1 + (2 * g) / (grain + 1) + (((g * 37 + index * 11) % 7) - 3) * 0.04;
              lines.push(k.pathOf([at(facePoint(F, f, from, x)), at(facePoint(F, f, to, x))]));
            }
          }
          inner += L(lines.join(""), { tone: "faint" });
        }
        let over = "";
        const dots = [];
        for (const nail of nails) {
          const s = nail.s ?? nail.at;
          if (s < from || s > to) continue;
          const f = faces(F, w, h).find((face) => face.key === (nail.face || "u"));
          if (!f || !visibleFace(f.n)) continue;
          for (const x of nail.x !== undefined ? [].concat(nail.x) : [-0.5, 0.5]) dots.push(at(facePoint(F, f, s, x)));
        }
        if (dots.length) over += D(dots, { size: o.nailSize || 0.5, tone: o.nailTone || "hi" });
        for (const peg of pegs) {
          const s = peg.s ?? peg.at;
          if (s < from || s > to) continue;
          const f = faces(F, w, h).find((face) => face.key === (peg.face || "u"));
          if (!f || !visibleFace(f.n)) continue;
          for (const x of peg.x !== undefined ? [].concat(peg.x) : [0]) {
            const c = facePoint(F, f, s, x);
            const PF = G.frameAlong(c, f.n);
            over += L(G.circleOf(PF, 0.05, peg.r || Math.min(w, h) * 0.12, P, 12), { tone: "lo" });
          }
        }
        const segId = segments.length > 1 ? `${id}.${index}` : id;
        partOf(segId, S(paths, { ...o, inner: (o.inner || "") + inner, over: (o.over || "") + over }), prismShape(F, section, from, to), o);
      });
      sorted.forEach((band, index) => {
        const t = band.t;
        const sec = round > 0 ? polyRound(w + 2 * t, h + 2 * t, round + t) : polyRect(w + 2 * t, h + 2 * t);
        const paths = extrudeAlong(F, sec, band.at - band.w / 2, band.at + band.w / 2, P);
        let over = "";
        const dots = [];
        for (const f of faces(F, w + 2 * t, h + 2 * t)) if (visibleFace(f.n) && o.bandNails !== false) dots.push(at(facePoint(F, f, band.at, 0)));
        if (dots.length) over = D(dots, { size: 0.45, tone: "hi" });
        partOf(`${id}.band${index}`, S(paths, { tone: "hi", crease: "lo", over }), prismShape(F, sec, band.at - band.w / 2, band.at + band.w / 2), { ...o, mat: o.bandMat || "iron", lit: false });
      });
      return { F, length: L0 };
    },

    // A prism of any polygon (in u, v) along a frame, s0 → s1.
    prism(id, F, poly, s0, s1, o = {}) {
      const paths = extrudeAlong(F, poly, s0, s1, P, { convex: o.convex ?? true });
      partOf(id, S(paths, o), prismShape(F, poly, s0, s1), o);
    },

    // A vertical kit slab on the floor plan.
    slab(id, plan, z, h, o = {}) {
      const paths = k.slabOf(plan, z, h, P, o.steps ?? 4, o.bevel ?? 0);
      let inner = o.inner || "";
      if (o.groove) inner += L(k.planOutline(k.insetPlan(plan, o.groove), z + h, P, o.steps ?? 4), { tone: "faint" });
      if (o.seams) inner += L(o.seams.map((zz) => k.sideSeam(plan, zz, P, o.steps ?? 4)).join(""), { tone: "faint" });
      const ring = k.ringOf(plan, 2);
      const pts = [...ring.map(([x, y]) => [x, y, z]), ...ring.map(([x, y]) => [x, y, z + h])];
      partOf(id, S(paths, { ...o, inner }), shapeOf(pts, { axes: [[1, 0, 0], [0, 1, 0], [0, 0, 1]], edges: [[1, 0, 0], [0, 1, 0], [0, 0, 1]] }), o);
    },

    // A round bar, pin, axle, drum or disc from p0 to p1.
    cyl(id, p0, p1, r, o = {}) {
      const L0 = len(sub(p1, p0));
      const F = o.F || G.frameAlong(p0, sub(p1, p0));
      const small = !o.lathe && r * KS < 6;
      const paths = small ? extrudeAlong(F, polyCircle(r, r * KS < 2.5 ? 10 : 16), 0, L0, P) : G.disc(0, L0, r, F, P, { bevel: o.bevel || 0, steps: o.steps });
      let inner = o.inner || "";
      if (o.seams) inner += L(o.seams.map((s) => G.arcOf(F, s, r, P)).join(""), { tone: o.seamTone || "faint" });
      if (o.ribs) {
        const rb = o.ribs;
        inner += k.fadedSvg(G.ribsOf(F, rb.s0 ?? 0, rb.s1 ?? L0, r, rb.count || 24, P, { fade: [0.1, 0.55], twist: rb.twist || 0, phase: rb.phase || 0 }), { tone: rb.tone || "lo" });
      }
      let over = o.over || "";
      if (o.bolts) for (const bc of [].concat(o.bolts)) over += D(G.dotsOf(F, bc.s ?? L0, bc.r ?? r * 0.7, bc.count || 6, P, { all: bc.all ?? true, phase: bc.phase || 0, fade: bc.all === false ? [0.04, 0.42] : null }), { size: bc.size || 0.5, tone: bc.tone || "hi" });
      if (o.faceRing) for (const fr of [].concat(o.faceRing)) {
        const s = fr.s ?? L0;
        const nrm = s > L0 / 2 ? F.a : mul(F.a, -1);
        if (visibleFace(nrm)) over += L(G.circleOf(F, s, fr.r, P), { tone: fr.tone || "faint" });
      }
      partOf(id, S(paths, { ...o, inner, over }), roundShape(F, 0, L0, r), o);
      return F;
    },

    // An annulus: rings, washers, hoops, bushings.
    ring(id, p0, p1, rIn, rOut, o = {}) {
      const L0 = len(sub(p1, p0));
      const F = o.F || G.frameAlong(p0, sub(p1, p0));
      const paths = G.ringBand(0, L0, rIn, rOut, F, P);
      partOf(id, S(paths, o), roundShape(F, 0, L0, rOut), o);
      return F;
    },

    // A turned part: profile [[s, r(, smooth)]] along frame F.
    turned(id, F, profile, o = {}) {
      const rMax = Math.max(...profile.map(([, r]) => r));
      const paths = G.solidOf(profile, F, P, { smooth: o.smooth ?? (rMax * KS < 7 ? false : "auto"), bevel: o.bevel || 0 });
      const pts = [];
      for (const [s, r] of profile) pts.push(...ringPts(F, s, Math.max(r, 0.01), 10));
      let inner = o.inner || "";
      if (o.seams) inner += L(o.seams.map(([s, r, slope = 0]) => G.arcOf(F, s, r, P, { slope })).join(""), { tone: "faint" });
      partOf(id, S(paths, { ...o, inner }), shapeOf(pts, { axes: [F.a], edges: [F.a, F.u, F.v] }), o);
    },

    ball(id, c, r, o = {}) {
      const paths = G.sphereOf(c, r, P, { steps: o.steps || (r * KS < 4 ? 20 : r * KS < 10 ? 28 : 40) });
      partOf(id, S(paths, o), shapeOf([c], { r }), o);
    },

    // A rope, cable, sling cord or bowstring. Returns its pieces' ids.
    rope(id, pts, r, o = {}) {
      if (pts.length < 2) return [];
      if (r * KS < (o.thin ?? 1.3)) {
        const d = k.pathOf(pts.map(at));
        partOf(`${id}~0`, `<path class="iso-line rope-line" data-tone="${o.tone || "hi"}" style="stroke-width:${Math.max(0.7, 2 * r * KS).toFixed(2)}px" d="${d}"/>`, shapeOf(pts, { r, edges: [unit(sub(pts[pts.length - 1], pts[0]))] }), { mat: "rope", ...o });
        return [`${id}~0`];
      }
      if (!o.precise) return fastRope(id, pts, r, o);
      const twist = o.twist ?? r * KS > 1.2;
      const pieces = TB.tubePieces(pts, r, P, {
        maxLength: o.maxLength ?? 14,
        spacing: Math.max(1.2, Math.min(3, r * 2)),
        caps: o.caps ?? true,
        rings: twist ? { pitch: o.pitch ?? Math.max(0.8, r * 2.4), twist: o.lay ?? 1.3, fade: [0.12, 0.6], tone: "lo" } : null,
      });
      const ids = [];
      pieces.forEach((piece, i) => {
        const pid = `${id}~${i}`;
        ids.push(pid);
        partOf(pid, TB.tubeSvg(piece, { tone: o.tone || "hi" }), shapeOf(piece.points, { r, edges: [unit(sub(piece.points[piece.points.length - 1], piece.points[0]))], axes: [] }), { mat: "rope", ...o });
      });
      return ids;
    },
    // A thin taut line (bowstring, lashing) drawn as a stroked path.
    cord(id, pts, o = {}) {
      const d = k.pathOf(pts.map(at));
      const width = o.width ?? 1.1;
      partOf(id, `<path class="iso-line cord" data-tone="${o.tone || "hi"}" style="stroke-width:${width}px" d="${d}"/>`, shapeOf(pts, { r: o.r ?? 0.4, edges: [unit(sub(pts[pts.length - 1], pts[0]))] }), o);
    },

    // Soft ground shadow under a footprint polygon (floor points).
    halo(id, ring, z = 0, o = {}) {
      const d = k.pathOf(G.hullOf(ring.map(([x, y]) => at([x, y, z]))), true);
      partOf(id, `<path class="iso-halo" d="${d}"${o.blur ? ` style="filter:blur(${o.blur}px)"` : ""}/>`, shapeOf(ring.map(([x, y]) => [x, y, z])), { layer: -1, ...o });
    },

    // Lines with no body of their own (marks, ticks) drawn as a part.
    marks(id, svg, pts, o = {}) {
      partOf(id, svg, shapeOf(pts, { r: o.r ?? 0.3 }), o);
    },

    // A spoked wheel. T is a frame {o, a, u, v}: axis a, hub centre o. phase turns it.
    wheel(id, F, o = {}) {
      const { R = 30, rim = 3, width = 4, spokes = 8, hub = 5, hubLen = width * 1.8, phase = 0, segments = 16, spokeW = 1.6, mat = "wood", tone = "hi", tyre = 0 } = o;
      const s0 = -width / 2;
      const s1 = width / 2;
      const rIn = R - rim;
      for (let i = 0; i < segments; i++) {
        const a0 = phase + (i / segments) * TAU;
        const a1 = phase + ((i + 1) / segments) * TAU;
        const poly = [
          [rIn * Math.cos(a0), rIn * Math.sin(a0)],
          [rIn * Math.cos(a1), rIn * Math.sin(a1)],
          [R * Math.cos(a1), R * Math.sin(a1)],
          [R * Math.cos((a0 + a1) / 2) / Math.cos((a1 - a0) / 2), R * Math.sin((a0 + a1) / 2) / Math.cos((a1 - a0) / 2)].map((x) => x * 0.995),
          [R * Math.cos(a0), R * Math.sin(a0)],
        ];
        const rimF = { o: F.o, a: F.a, u: F.u, v: F.v };
        const paths = extrudeAlong(rimF, poly, s0, s1, P);
        let over = "";
        if (o.nails !== false && i % 2 === 0) {
          const mid = (a0 + a1) / 2;
          const n = F.a;
          const sFace = visibleFace(n) ? s1 : visibleFace(mul(n, -1)) ? s0 : null;
          if (sFace !== null) over = D([at(framePoint(F, sFace, (R - rim / 2) * Math.cos(mid), (R - rim / 2) * Math.sin(mid)))], { size: 0.45, tone: "hi" });
        }
        partOf(`${id}.rim${i}`, S(paths, { tone, over }), prismShape(rimF, poly, s0, s1), { ...o, mat });
        if (tyre) {
          const tp = [
            [R * Math.cos(a0), R * Math.sin(a0)],
            [R * Math.cos(a1), R * Math.sin(a1)],
            [(R + tyre) * Math.cos(a1), (R + tyre) * Math.sin(a1)],
            [(R + tyre) * Math.cos(a0), (R + tyre) * Math.sin(a0)],
          ];
          partOf(`${id}.tyre${i}`, S(extrudeAlong(rimF, tp, s0 + 0.3, s1 - 0.3, P), { tone: "hi", crease: "lo" }), prismShape(rimF, tp, s0 + 0.3, s1 - 0.3), { ...o, mat: "iron" });
        }
      }
      for (let i = 0; i < spokes; i++) {
        const a = phase + ((i + 0.5) / spokes) * TAU;
        const dir = frameDir(F, Math.cos(a), Math.sin(a));
        const p0 = add(F.o, mul(dir, hub * 0.98));
        const p1 = add(F.o, mul(dir, rIn + 0.2));
        B.beam(`${id}.spoke${i}`, p0, p1, { w: spokeW, h: spokeW * 0.8, up: F.a, mat, tone, sys: o.sys, cut: o.cut, layer: o.layer });
      }
      B.cyl(`${id}.hub`, add(F.o, mul(F.a, -hubLen / 2)), add(F.o, mul(F.a, hubLen / 2)), hub, { mat, tone, sys: o.sys, cut: o.cut, layer: o.layer, faceRing: [{ s: 0, r: hub * 0.55 }, { s: hubLen, r: hub * 0.55 }], bolts: o.hubBolts ? [{ s: hubLen, r: hub * 0.75, count: 6 }, { s: 0, r: hub * 0.75, count: 6 }] : undefined });
      if (o.hubBands !== false) {
        B.ring(`${id}.hubband0`, add(F.o, mul(F.a, -hubLen / 2)), add(F.o, mul(F.a, -hubLen / 2 + 0.8)), hub, hub + 0.45, { mat: "iron", tone: "hi", sys: o.sys, cut: o.cut, layer: o.layer });
        B.ring(`${id}.hubband1`, add(F.o, mul(F.a, hubLen / 2 - 0.8)), add(F.o, mul(F.a, hubLen / 2)), hub, hub + 0.45, { mat: "iron", tone: "hi", sys: o.sys, cut: o.cut, layer: o.layer });
      }
    },

    // A toothed disc (ratchet, gear, sprocket) in frame F, thickness s0 → s1.
    toothed(id, F, poly, s0, s1, o = {}) {
      const paths = extrudeAlong(F, poly, s0, s1, P, { convex: false });
      const rMax = Math.max(...poly.map(([x, y]) => Math.hypot(x, y)));
      partOf(id, S(paths, o), roundShape(F, s0, s1, rMax), o);
    },

    // A chain of links along a polyline. Alternate links turn 90°.
    chain(id, pts, o = {}) {
      const { link = 3, wire = 0.45, mat = "iron" } = o;
      const route = G.resample(pts, link * 0.78);
      for (let i = 0; i + 1 < route.length; i++) {
        const a = route[i];
        const b = route[i + 1];
        const ax = unit(sub(b, a));
        const side = i % 2 ? frameFrom(a, b, [0, 0, 1]).u : frameFrom(a, b, [0, 0, 1]).v;
        const F = { o: a, a: ax, u: unit(cross(side, ax)), v: side };
        const l = len(sub(b, a));
        const poly = [[-wire, -link * 0.32], [wire, -link * 0.32], [wire, link * 0.32], [-wire, link * 0.32]];
        const Fl = { o: add(a, mul(ax, -link * 0.12)), a: ax, u: F.u, v: F.v };
        partOf(`${id}~${i}`, S(extrudeAlong(Fl, poly, 0, l + link * 0.24, P), { tone: o.tone || "hi", crease: "lo" }), prismShape(Fl, poly, 0, l + link * 0.24), { ...o, mat });
      }
    },

    // The display plinth the machine stands on: a heavy plate on feet, a groove, corner
    // screws, a metre ruler along the front edge and a label plate.
    plinth(plan, o = {}) {
      const { h = 10, foot = 5, z = 0, ruler = true, label = true, groove = 6, mat } = o;
      const zTop = z;
      const zBot = z - h;
      emit({ id: "plinth.halo", svg: `<path class="iso-halo" d="${k.haloOf(plan, zBot - foot, h, P)}"/>`, shape: shapeOf(k.ringOf(plan, 2).map(([x, y]) => [x, y, zBot - foot])), layer: -3 });
      const feet = k.corners(plan, Math.min(26, plan.w * 0.08, plan.d * 0.12)).sort((p, q) => dot([p[0], p[1], 0], V) - dot([q[0], q[1], 0], V));
      feet.forEach(([x, y], i) => {
        emit({ id: `plinth.foot${i}`, svg: S(k.cylinder(x, y, 8, zBot - foot, 1.8, P, 28), { tone: "lo" }) + S(k.cylinder(x, y, 6, zBot - foot + 1.8, foot - 1.8, P, 28), { tone: "mid" }), shape: shapeOf([[x, y, zBot - foot], [x, y, zBot]], { r: 8 }), layer: -3, mat });
      });
      const screws = k.corners(plan, 12);
      const inner = groove ? L(k.planOutline(k.insetPlan(plan, groove), zTop, P, 8), { tone: "lo" }) : "";
      const over = L(screws.map(([x, y]) => k.ring(x, y, 2.4, zTop, P, 16)).join(""), { tone: "lo" }) + D(screws.map(([x, y]) => at([x, y, zTop])), { size: 0.55 });
      emit({ id: "plinth.slab", svg: S(k.slabOf(plan, zBot, h, P, 8, 1.6), { tone: "mid", inner, over }), shape: shapeOf(k.ringOf(plan, 2).flatMap(([x, y]) => [[x, y, zBot], [x, y, zTop]])), layer: -2, mat });
      if (ruler) {
        const metre = 1 / metresPerUnit;
        const alongY = ruler === "y";
        const strip = alongY ? { x: plan.x + plan.w - 16, y: plan.y + 18, w: 8, d: plan.d - 36, r: 1 } : { x: plan.x + 18, y: plan.y + plan.d - 16, w: plan.w - 36, d: 8, r: 1 };
